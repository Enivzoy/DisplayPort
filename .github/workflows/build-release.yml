name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and name the addon JAR
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assemble

          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ -z "$VERSION" ]]; then
            echo "mod_version was not found in gradle.properties" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME must match version v$VERSION" >&2
            exit 1
          fi

          SOURCE_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          if [[ -z "$SOURCE_JAR" ]]; then
            echo "No addon JAR was produced in build/libs" >&2
            exit 1
          fi

          RELEASE_JAR="build/libs/DisplayPort-${VERSION}.jar"
          cp "$SOURCE_JAR" "$RELEASE_JAR"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DisplayPort-${{ steps.package.outputs.version }}
          path: build/libs/DisplayPort-${{ steps.package.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: DisplayPort ${{ steps.package.outputs.version }}
          generate_release_notes: true
          files: build/libs/DisplayPort-${{ steps.package.outputs.version }}.jar
